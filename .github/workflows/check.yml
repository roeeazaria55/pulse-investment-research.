name: Read-only PR checks
on:
  push:
    branches: [pulse/phase1-financial-data-engine, pulse/phase1b-reusable-financial-engine]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check live official source metadata read-only
        run: python3 scripts/official_sources.py
      - name: Read official report content without changing published research
        run: |
          python3 -m pip install --disable-pip-version-check -r scripts/requirements-report-intake.txt
          python3 scripts/report_intake.py
          python3 scripts/report_review_queue.py
          python3 scripts/financial_observations.py
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Install browser test runtime
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Test mobile research, PDF worker and import persistence
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          mkdir -p work
          npm run preview > work/preview.log 2>&1 &
          python3 scripts/mobile_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-report-intake-evidence
          path: |
            public/data/report-intake.json
            public/data/report-review-queue.json
            public/data/auto-financial-observations.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-mobile-evidence
          path: |
            work/mobile-*.png
            work/mobile-*.json
          retention-days: 7

