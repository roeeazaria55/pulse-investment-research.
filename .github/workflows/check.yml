name: Read-only PR checks
on:
  push:
    branches: [pulse/phase1-financial-data-engine, pulse/phase1b-reusable-financial-engine]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install offline Hebrew release-PDF dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r scripts/requirements-pulse-release.txt
          test -s /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify live GitHub security evidence with read-only GITHUB_TOKEN (no release or paid API)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAID_AI_ENABLED: ${{ vars.PAID_AI_ENABLED }}
          PAID_AI_SCHEDULE_ENABLED: ${{ vars.PAID_AI_SCHEDULE_ENABLED }}
        run: |
          python3 -c 'import json,os; print(json.dumps({"readinessSwitches": {k: os.getenv(k, "") for k in ("PAID_AI_ENABLED", "PAID_AI_SCHEDULE_ENABLED")}}))'
          python3 scripts/pulse_release_security.py --preflight
          python3 scripts/pulse_release_security.py --environment pulse-ai-paid --preflight
      - name: Check live official source metadata read-only
        run: python3 scripts/official_sources.py
      - name: Read official report content without changing published research
        run: |
          python3 -m pip install --disable-pip-version-check -r scripts/requirements-report-intake.txt
          python3 scripts/report_intake.py
          python3 scripts/report_review_queue.py
          python3 scripts/financial_observations.py
          python3 scripts/forecast_archive.py
          python3 scripts/forecast_actual_comparison.py
          python3 scripts/research_update_proposals.py
          python3 scripts/issuer_coverage.py
          python3 scripts/latest_research_updates.py
          python3 scripts/financial_integrity_audit.py
          python3 scripts/research_update_history.py
          python3 scripts/earnings_research_candidates.py
          python3 scripts/pulse_ai_analysis_queue.py
          python3 scripts/ai_research_packets.py
          python3 scripts/run_optional_ai_review.py --ticker DLO
      - name: Rehearse META earnings to AI review without any model key or charge
        run: |
          python3 scripts/pulse_ai_pipeline.py --ticker META --output work/pulse-ai-mock-preview.json
          python3 -c 'import json; r=json.load(open("work/pulse-ai-mock-preview.json")); assert r["analysisMode"]=="mock-simulation-no-model" and not r["paidAiExecuted"] and r["validation"]["modelChanges"]==0'
          python3 scripts/pulse_mock_research_pdf.py
          test -s work/release-preview/meta-q3-2026-TEST-MOCK.pdf
      - name: Retain newly collected official issuer evidence before slow browser tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-issuer-source-probe
          path: |
            public/data/report-intake.json
            public/data/issuer-coverage.json
            public/data/latest-research-updates.json
            work/financial-integrity-audit.json
          retention-days: 3
      - run: npm test
      - run: npm run typecheck
      - run: npm run validate:data
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Install browser test runtime
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Test mobile research, PDF worker and import persistence
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          mkdir -p work
          npm run preview > work/preview.log 2>&1 &
          python3 scripts/mobile_check.py
          python3 scripts/pulse_visual_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-report-intake-evidence
          path: |
            public/data/report-intake.json
            public/data/report-review-queue.json
            public/data/auto-financial-observations.json
            public/data/forecast-archive.json
            public/data/forecast-actual-comparisons.json
            public/data/research-update-proposals.json
            public/data/latest-research-updates.json
            public/data/research-update-history.json
            public/data/issuer-coverage.json
            public/data/earnings-research-candidates.json
            public/data/ai-analysis-queue.json
            public/data/ai-research-packets/*.json
            work/pulse-ai-mock-preview.json
            work/release-preview/*.pdf
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-mobile-evidence
          path: |
            work/mobile-*.png
            work/mobile-*.json
            work/premium-review/*.png
            work/premium-review/manifest.json
          retention-days: 7

