name: Publish PULSE
on:
  push:
    branches: [main]
    paths-ignore: ["public/data/feed.json", "public/data/ingestion-state.json", "public/data/official-sources.json", "public/data/report-intake.json", "public/data/report-review-queue.json", "public/data/auto-financial-observations.json", "public/data/forecast-archive.json", "public/data/forecast-actual-comparisons.json", "public/data/research-update-proposals.json", "public/data/latest-research-updates.json", "public/data/research-update-history.json", "public/data/issuer-coverage.json", "public/data/earnings-research-candidates.json"]
  workflow_dispatch:
  schedule:
    # Existing ~30-minute collection polls. Two Jerusalem briefings are classified
    # after the 08:00 and 19:00 local boundaries (DST-aware); runs can be delayed.
    - cron: "17,47 * * * *"
permissions: {}
concurrency:
  group: pulse-production
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      skipped: ${{ steps.collect.outputs.skipped }}
      base_sha: ${{ steps.base.outputs.sha }}
      data_base_sha: ${{ steps.seed.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit/regression tests use repository-retained issuer fixtures. Loading
      # mutable pulse-data first changes their evidence and makes them brittle.
      # The production snapshot is loaded after these tests and is independently
      # validated during the collection pipeline below.
      - name: Test version-controlled financial fixtures before pulse-data seed
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test version-controlled UI and financial fixture contracts
        run: npm test
      - name: Load prior public collection state from a separate branch
        id: seed
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/pulse-data:refs/remotes/origin/pulse-data
          echo "sha=$(git rev-parse refs/remotes/origin/pulse-data)" >> "$GITHUB_OUTPUT"
          for file in public/data/feed.json public/data/ingestion-state.json public/data/official-sources.json public/data/report-intake.json public/data/report-review-queue.json public/data/auto-financial-observations.json public/data/forecast-archive.json public/data/forecast-actual-comparisons.json public/data/research-update-proposals.json public/data/latest-research-updates.json public/data/research-update-history.json public/data/issuer-coverage.json public/data/earnings-research-candidates.json; do
            if git cat-file -e "refs/remotes/origin/pulse-data:$file"; then
              git show "refs/remotes/origin/pulse-data:$file" > "$file"
            fi
          done
      - name: Preserve prior public snapshot for independent enrichment
        run: |
          mkdir -p work
          cp public/data/feed.json work/previous-feed.json
      - name: Discover public company headlines independently of SEC
        run: python3 scripts/collect_articles.py
      - name: Collect supplemental SEC metadata and combine snapshots
        id: collect
        run: node scripts/ingest/run.mjs
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      - name: Validate public feed
        if: steps.collect.outputs.skipped != 'true'
        run: node scripts/ingest/validate.mjs
      - name: Rank evidence, collect industry context and check official earnings metadata
        if: steps.collect.outputs.skipped != 'true'
        run: python3 scripts/build_intelligence.py
      - name: Validate enriched public snapshot
        if: steps.collect.outputs.skipped != 'true'
        run: node scripts/ingest/validate.mjs
      - name: Collect pilot official company sources
        if: steps.collect.outputs.skipped != 'true'
        run: python3 scripts/official_sources.py
      - name: Read official report bodies and extract source tables
        if: steps.collect.outputs.skipped != 'true'
        run: |
          python3 -m pip install --disable-pip-version-check -r scripts/requirements-report-intake.txt
          python3 scripts/report_intake.py
      - name: Update pending review queue from official source evidence
        if: steps.collect.outputs.skipped != 'true'
        run: python3 scripts/report_review_queue.py
      - name: Propose typed financial observations from approved issuer table layouts
        if: steps.collect.outputs.skipped != 'true'
        run: python3 scripts/financial_observations.py
      - name: Archive source-anchored investment research forecasts
        if: steps.collect.outputs.skipped != 'true'
        run: python3 scripts/forecast_archive.py
      - name: Compare only previously archived and formally approved financial facts
        if: steps.collect.outputs.skipped != 'true'
        run: python3 scripts/forecast_actual_comparison.py
      - name: Generate evidence-only research briefs
        if: steps.collect.outputs.skipped != 'true'
        run: python3 scripts/research_update_proposals.py
      - name: Build verified 12-issuer document coverage
        if: steps.collect.outputs.skipped != 'true'
        run: python3 scripts/issuer_coverage.py
      - name: Build latest source-backed research updates
        if: steps.collect.outputs.skipped != 'true'
        run: python3 scripts/latest_research_updates.py
      - name: Preserve immutable source-backed research history
        if: steps.collect.outputs.skipped != 'true'
        run: python3 scripts/research_update_history.py
      - name: Generate append-only, unapproved earnings research candidates
        if: steps.collect.outputs.skipped != 'true'
        run: python3 scripts/earnings_research_candidates.py
      - name: Generate 12 source-bound review input packets, never AI judgments
        if: steps.collect.outputs.skipped != 'true'
        run: python3 scripts/ai_research_packets.py
      - name: Build the exact collected snapshot
        if: steps.collect.outputs.skipped != 'true'
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-artifact@v4
        if: steps.collect.outputs.skipped != 'true'
        with:
          name: public-ingestion-state
          path: |
            public/data/feed.json
            public/data/ingestion-state.json
            public/data/official-sources.json
            public/data/report-intake.json
            public/data/report-review-queue.json
            public/data/auto-financial-observations.json
            public/data/forecast-archive.json
            public/data/forecast-actual-comparisons.json
            public/data/research-update-proposals.json
            public/data/latest-research-updates.json
            public/data/research-update-history.json
            public/data/issuer-coverage.json
            public/data/earnings-research-candidates.json
          retention-days: 7
      - name: Install browser test runtime for code/manual releases only
        if: github.event_name != 'schedule'
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Test 320/390/430 RTL, text scaling and simulated keyboard
        if: github.event_name != 'schedule'
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm run preview > work/preview.log 2>&1 &
          python3 scripts/mobile_check.py
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'schedule'
        with:
          name: mobile-emulation-evidence
          path: |
            work/mobile-*.png
            work/mobile-check.json
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: steps.collect.outputs.skipped != 'true'
        with:
          path: dist
  persist:
    needs: collect
    if: needs.collect.outputs.skipped != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.persist.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pulse-data
      - uses: actions/download-artifact@v4
        with:
          name: public-ingestion-state
          path: work/ingestion-artifact
      - name: Commit only selected public state files
        id: persist
        env:
          EXPECTED_BASE: ${{ needs.collect.outputs.data_base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          cp work/ingestion-artifact/feed.json public/data/feed.json
          cp work/ingestion-artifact/ingestion-state.json public/data/ingestion-state.json
          cp work/ingestion-artifact/official-sources.json public/data/official-sources.json
          cp work/ingestion-artifact/report-intake.json public/data/report-intake.json
          cp work/ingestion-artifact/report-review-queue.json public/data/report-review-queue.json
          cp work/ingestion-artifact/auto-financial-observations.json public/data/auto-financial-observations.json
          cp work/ingestion-artifact/forecast-archive.json public/data/forecast-archive.json
          cp work/ingestion-artifact/forecast-actual-comparisons.json public/data/forecast-actual-comparisons.json
          cp work/ingestion-artifact/research-update-proposals.json public/data/research-update-proposals.json
          cp work/ingestion-artifact/latest-research-updates.json public/data/latest-research-updates.json
          cp work/ingestion-artifact/research-update-history.json public/data/research-update-history.json
          cp work/ingestion-artifact/issuer-coverage.json public/data/issuer-coverage.json
          cp work/ingestion-artifact/earnings-research-candidates.json public/data/earnings-research-candidates.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/data/feed.json public/data/ingestion-state.json public/data/official-sources.json public/data/report-intake.json public/data/report-review-queue.json public/data/auto-financial-observations.json public/data/forecast-archive.json public/data/forecast-actual-comparisons.json public/data/research-update-proposals.json public/data/latest-research-updates.json public/data/research-update-history.json public/data/issuer-coverage.json public/data/earnings-research-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public news and SEC collection state [skip ci]"
            git push origin HEAD:pulse-data
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: [collect, persist]
    if: needs.collect.outputs.skipped != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Reject a superseded publication
        uses: actions/github-script@v7
        env:
          EXPECTED_HEAD: ${{ needs.collect.outputs.base_sha }}
          EXPECTED_DATA_HEAD: ${{ needs.persist.outputs.sha }}
        with:
          script: |
            const {data} = await github.rest.git.getRef({...context.repo, ref:'heads/main'});
            if (data.object.sha !== process.env.EXPECTED_HEAD) throw new Error('A newer main exists; do not publish an old snapshot.');
            const state = await github.rest.git.getRef({...context.repo, ref:'heads/pulse-data'});
            if (state.data.object.sha !== process.env.EXPECTED_DATA_HEAD) throw new Error('A newer data state exists; do not publish stale artifacts.');
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        if: github.event_name != 'schedule'
        with:
          ref: ${{ needs.collect.outputs.base_sha }}
          persist-credentials: false
      - name: Install browser runtime for public-site verification
        if: github.event_name != 'schedule'
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Verify deployed IREN values, research assets and mobile behavior
        if: github.event_name != 'schedule'
        env:
          PULSE_CHECK_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/mobile_check.py
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'schedule'
        with:
          name: public-site-mobile-evidence
          path: |
            work/mobile-*.png
            work/mobile-*.json
          retention-days: 14
  notify:
    needs: deploy
    if: success()
    permissions:
      contents: read
    uses: ./.github/workflows/notify.yml
    secrets:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      PULSE_NOTIFY_CONFIG: ${{ secrets.PULSE_NOTIFY_CONFIG }}

