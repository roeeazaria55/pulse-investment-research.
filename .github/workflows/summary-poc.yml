name: Hebrew summary feasibility
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pulse-summary-feasibility
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only open-model runtime, no hosted inference
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'transformers>=4.51,<5' 'safetensors>=0.4,<1'
      - name: Test Hebrew company and industry output on actual source metadata
        run: python scripts/summary_poc.py
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hebrew-summary-poc
          path: work/summary-poc.json
          retention-days: 14
